# Lints the chart with the RPC secret and the admin token read from mounted files.
garage:
  singleNode: false
environment:
  - name: GARAGE_RPC_SECRET_FILE
    value: /mnt/secrets/rpc-secret
  - name: GARAGE_ADMIN_TOKEN_FILE
    value: /mnt/secrets/admin-token
  - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
    value: "true"
extraVolumes:
  - name: secrets
    secret:
      secretName: garage-secrets
extraVolumeMounts:
  - name: secrets
    mountPath: /mnt/secrets
    readOnly: true

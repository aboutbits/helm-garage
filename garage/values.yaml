nameOverride: ""
fullnameOverride: ""

image:
  repository: dxflrs/garage
  tag: v2.4.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

garage:
  singleNode: true
  dbEngine: lmdb
  blockSize: "1048576"
  compressionLevel: "1"
  metadataAutoSnapshotInterval: ""
  additionalTopLevelConfig: ""
  existingRpcSecret:
    name: ""
    key: rpc_secret

s3:
  region: garage
  rootDomain: ".s3.garage"

admin:
  port: 3903
  token: ""
  existingSecret:
    name: ""
    key: admin_token

bootstrap:
  enabled: false
  defaultBucket: default-bucket
  accessKey: ""
  secretKey: ""
  existingSecret:
    name: ""
    accessKeyKey: default_access_key
    secretKeyKey: default_secret_key

service:
  type: ClusterIP
  s3:
    port: 3900
  annotations: {}

ingress:
  enabled: false
  name: ""
  className: ""
  annotations: {}
  labels: {}
  hosts:
    - host: s3.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  name: ""
  parentRefs: []
  hostnames: []
  annotations: {}
  labels: {}
  matches:
    - path:
        type: PathPrefix
        value: /

persistence:
  meta:
    storageClassName: local-path
    size: 2Gi
    accessModes:
      - ReadWriteOnce
  data:
    storageClassName: local-path
    size: 20Gi
    accessModes:
      - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

priorityClassName: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

probes:
  liveness:
    httpGet:
      path: /metrics
      port: admin
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  readiness:
    tcpSocket:
      port: s3
    initialDelaySeconds: 5
    periodSeconds: 5

environment: []

extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: false
  annotations: {}
  name: ""

monitoring:
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      path: /metrics
      labels: {}
      interval: 15s
      scheme: http
      tlsConfig: {}
      scrapeTimeout: 10s
      relabelings: []

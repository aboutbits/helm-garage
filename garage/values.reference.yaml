# Reference values for the garage chart.
#
# This chart deploys a single-node Garage (S3-compatible object store): one
# StatefulSet replica, replication_factor=1, no node discovery/clustering. It
# keeps the upstream chart's security hardening and optional Prometheus
# monitoring, and adds an optional first-boot bucket + access key bootstrap.
#
# Secrets: every secret can be given as a plain value, which the chart stores in
# its own Secret, or as a reference to an existing Secret that a secret manager
# (1Password operator, External Secrets, Sealed Secrets, ...) creates. Prefer
# the existing Secret: plain values are stored wherever the values are, e.g. the
# Terraform state of a helm_release and the Helm release Secret. Garage receives
# all secrets as environment variables (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
# GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY), never through
# garage.toml. To read the RPC secret or the admin token from a mounted file
# instead, see `environment` below.

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

# -- Container image configuration
image:
  # -- Repository of the container image
  repository: dxflrs/garage
  # -- Tag of the container image
  tag: v2.4.1
  # -- Image pull policy. Accepted values: Always, Never, IfNotPresent
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Garage configuration. These values are rendered into garage.toml.
garage:
  # -- Start Garage with `--single-node`. Garage then creates the cluster layout
  # itself on first boot, and refuses to start once the layout version is higher
  # than 1. Set to false when the AboutBits Garage Operator manages the layout
  # through a GarageCluster: the operator applies new layout versions, which
  # single-node mode does not allow. bootstrap.enabled requires true, because
  # Garage accepts --default-bucket only in single-node mode.
  singleNode: true
  # -- Metadata database engine. https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#db_engine
  dbEngine: lmdb
  # -- Block size in bytes (default 1MB). https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#block_size
  blockSize: "1048576"
  # -- zstd compression level of stored blocks (integer 1-19), or "none" to
  # disable. https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#compression_level
  compressionLevel: "1"
  # -- If set, Garage snapshots the metadata DB at this interval into the metadata dir.
  metadataAutoSnapshotInterval: ""
  # -- Additional lines appended verbatim to garage.toml.
  additionalTopLevelConfig: ""
  # -- Existing Secret holding the RPC secret (64 hex chars, e.g.
  # `openssl rand -hex 32`). By default the chart generates the RPC secret and
  # stores it in its own Secret; it never leaves the cluster.
  existingRpcSecret:
    # -- Name of the Secret, in the release namespace. Empty = generated by the chart.
    name: ""
    # -- Key of the RPC secret in that Secret.
    key: rpc_secret

# -- S3 API settings. Garage only speaks plain HTTP; terminate TLS at the
# ingress/gateway if exposing it outside the cluster.
s3:
  # -- S3 region name Garage responds to. Arbitrary, but the client must sign
  # with the same value (e.g. AWS_DEFAULT_REGION=garage) or requests fail with
  # AuthorizationHeaderMalformed. Change only if a tool hardcodes a region.
  region: garage
  # -- Domain suffix (with leading dot) for virtual-hosted-style bucket access
  # (<bucket>.<rootDomain>). Only relevant when exposing Garage externally with
  # bucket-name-in-hostname URLs; requires wildcard DNS and a matching ingress
  # host. Unused for in-cluster / path-style clients (AWS_S3_FORCE_PATH_STYLE=true).
  rootDomain: ".s3.garage"

# -- Admin API: bucket/key management, health checks, and Prometheus metrics.
# Always enabled — the /health probes and monitoring below depend on it.
# Kept ClusterIP-only; never exposed via ingress.
admin:
  # -- Port the admin API listens on inside the container.
  port: 3903
  # -- Bearer token protecting the admin API (any sufficiently random string,
  # e.g. `openssl rand -base64 32`), stored in the chart's Secret. Set either
  # this or existingSecret.name. If neither is set, Garage starts without a
  # static admin token, and only admin tokens created with
  # `garage admin-token create` grant access to the admin API.
  token: ""
  # -- Existing Secret holding the admin token, e.g. the one the AboutBits
  # Garage Operator's GarageCluster reads through adminSecretRef.
  existingSecret:
    # -- Name of the Secret, in the release namespace.
    name: ""
    # -- Key of the admin token in that Secret.
    key: admin_token

# -- Optional bootstrap of a single default bucket + access key on first boot,
# via `garage server --default-bucket`. Disabled by default: most deployments
# provision buckets/keys out-of-band (Admin API, Terraform, ...). This is a
# one-time first-boot action; later buckets/keys or key rotation go through the
# Admin API, not values.
bootstrap:
  # -- Enable first-boot bucket + key creation.
  enabled: false
  # -- Name of the single bucket auto-created on first boot.
  defaultBucket: default-bucket
  # -- Access key ID for the default bucket, stored in the chart's Secret.
  # Required when bootstrap.enabled=true, unless existingSecret.name is set.
  # Must start with "GK" by Garage convention (GK + 16 hex chars).
  accessKey: ""
  # -- Secret access key for the default bucket, stored in the chart's Secret.
  # Required when bootstrap.enabled=true, unless existingSecret.name is set.
  secretKey: ""
  # -- Existing Secret holding the access key ID and the secret access key.
  # Garage reads these only from environment variables, so there is no file
  # variant for them.
  existingSecret:
    # -- Name of the Secret, in the release namespace.
    name: ""
    # -- Key of the access key ID in that Secret.
    accessKeyKey: default_access_key
    # -- Key of the secret access key in that Secret.
    secretKeyKey: default_secret_key

# -- Service configuration (ClusterIP by default; this is the in-cluster S3 endpoint).
service:
  # -- Kubernetes Service type.
  type: ClusterIP
  s3:
    # -- Port the S3 API is exposed on.
    port: 3900
  # -- Extra annotations for the Service.
  annotations: {}

# -- Classic Ingress for the S3 API (networking.k8s.io/v1; requires an ingress
# controller). Only needed to reach Garage from OUTSIDE the cluster. In-cluster
# clients use the Service directly. Enable AT MOST ONE of ingress / httpRoute.
ingress:
  # -- Enable the Ingress.
  enabled: false
  # -- Name of the Ingress object. Defaults to ingress-<fullname> when empty.
  name: ""
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  # -- Extra labels for the Ingress.
  labels: {}
  # -- Ingress hosts configuration.
  hosts:
    - host: s3.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- TLS configuration.
  tls: []
  #  - secretName: garage-tls
  #    hosts:
  #      - s3.example.com

# -- Gateway API HTTPRoute for the S3 API (gateway.networking.k8s.io/v1) — the
# modern alternative to ingress. Attaches to an existing Gateway via parentRefs
# (the Gateway itself is shared infra managed outside this chart). Requires the
# Gateway API CRDs installed. Enable AT MOST ONE of ingress / httpRoute.
httpRoute:
  # -- Enable the HTTPRoute.
  enabled: false
  # -- Name of the HTTPRoute object. Defaults to httproute-<fullname> when empty.
  name: ""
  # -- Gateway(s) this route attaches to. Required when httpRoute.enabled=true.
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # -- Hostnames this route matches. Empty = match all hostnames on the Gateway.
  hostnames: []
  #  - s3.example.com
  # -- HTTPRoute annotations.
  annotations: {}
  # -- Extra labels for the HTTPRoute.
  labels: {}
  # -- Path matches for the route.
  matches:
    - path:
        type: PathPrefix
        value: /

# -- Persistent storage. Single-node with replication_factor=1: there is no
# in-cluster replica, so durability comes from the underlying volumes and their
# backups. Make sure both the meta and data volumes are covered by the node's
# backup/snapshot schedule (e.g. daily disk snapshots).
persistence:
  # -- Metadata volume (LMDB database, indexes).
  meta:
    storageClassName: local-path
    size: 2Gi
    accessModes:
      - ReadWriteOnce
  # -- Data volume (object blocks).
  data:
    storageClassName: local-path
    size: 20Gi
    accessModes:
      - ReadWriteOnce

# -- Resource requests and limits. Starting point for a small single-node
# deployment; tune to your workload. LMDB benefits from memory for its page
# cache. No CPU limit by default to avoid throttling under bursty S3 traffic.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}

# -- Optional priority class name to assign to the pod.
priorityClassName: ""

# -- Extra annotations for the pod.
podAnnotations: {}
# -- Extra labels for the pod.
podLabels: {}

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# -- Container-level hardening. If a custom image needs to write outside the
# mounted meta/data dirs, add a writable volume via extraVolumes/extraVolumeMounts
# rather than loosening this.
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# -- Liveness/readiness probes. They check that Garage answers, not that the
# cluster can serve requests, so they do not use the admin API's /health: it
# answers 503 until the node has a cluster layout. With garage.singleNode=false
# the Pod would then never become ready, so the Service would not route the
# operator to the admin API that applies the layout, and the liveness probe would
# restart Garage in a loop.
# Liveness asks /metrics, which answers without a layout and without a token,
# because the chart sets no metrics_token. Readiness only checks that the S3 port
# accepts connections: the S3 API has no endpoint that answers 200 unauthenticated.
# For the health of the cluster, see `garage status` or /health, or with the
# AboutBits Garage Operator the status of the GarageCluster and S3Connection.
probes:
  liveness:
    httpGet:
      path: /metrics
      port: admin
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  readiness:
    tcpSocket:
      port: s3
    initialDelaySeconds: 5
    periodSeconds: 5

# -- Extra environment variables for the garage container, as a list of
# container env entries.
# Setting GARAGE_RPC_SECRET(_FILE) or GARAGE_ADMIN_TOKEN(_FILE) here hands that
# secret to the environment: the chart then neither generates the RPC secret
# nor sets the variable itself, and must not get garage.existingRpcSecret /
# admin.token / admin.existingSecret for it. Use this to read a secret from a
# file mounted via extraVolumes, e.g. by the Secrets Store CSI driver. Garage
# refuses secret files that are readable by group or others, which a mounted
# Secret is once podSecurityContext.fsGroup is set, so also set
# GARAGE_ALLOW_WORLD_READABLE_SECRETS:
#   - name: GARAGE_ADMIN_TOKEN_FILE
#     value: /mnt/secrets/admin-token
#   - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
#     value: "true"
environment: []

# -- Extra volumes, e.g. for custom TLS trust or a writable scratch dir.
extraVolumes: []
# -- Extra volume mounts matching extraVolumes.
extraVolumeMounts: []

# -- Service account configuration. Not required for single-node operation (no
# Kubernetes API access needed); off by default.
serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: false
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- Name of the ServiceAccount (generated from the fullname template if empty).
  name: ""

# -- Prometheus monitoring (scrapes the admin API port).
monitoring:
  metrics:
    # -- Expose the admin API's Prometheus metrics on a separate headless Service.
    enabled: false
    serviceMonitor:
      # -- Create a ServiceMonitor CRD for a prometheus-operator setup.
      enabled: false
      # -- Metrics path to scrape.
      path: /metrics
      # -- Extra labels for the ServiceMonitor.
      labels: {}
      # -- Scrape interval.
      interval: 15s
      # -- Scrape scheme.
      scheme: http
      # -- TLS config for scraping.
      tlsConfig: {}
      # -- Scrape timeout.
      scrapeTimeout: 10s
      # -- Metric relabeling rules.
      relabelings: []

name: Lint Chart

on:
  pull_request:

env:
  CHART_NAME: garage

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 4.2.3
      - name: Lint Helm chart
        run: helm lint ${{ env.CHART_NAME }} --strict
        shell: bash
